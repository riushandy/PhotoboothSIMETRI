<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Photobooth</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1b2d;color:#fff;user-select:none}
.screen{display:none;padding:16px;min-height:100vh}.screen.on{display:block}
h1{margin:4px 0 12px;font-size:28px;text-align:center}
.wrap{position:relative;max-width:720px;margin:0 auto}
.cam{width:100%;display:block;border-radius:16px;background:#000;transform:scaleX(-1)}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:200px;font-weight:700;text-shadow:0 0 30px #000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;border-radius:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{background:#1d2e4a;border-radius:14px;padding:8px;text-align:center}
.card img{width:100%;height:180px;object-fit:contain}.card:active{transform:scale(.97)}
.btn{font-size:22px;padding:16px 28px;border:0;border-radius:14px;background:#2aa9ff;color:#fff;margin:8px}
.btn.alt{background:#44556f}
.center{text-align:center}
#result{max-width:100%;max-height:62vh;border-radius:12px}
#qr{width:220px;background:#fff;padding:8px;border-radius:8px}
#msg{text-align:center;min-height:26px;color:#ff9a9a}#conn{position:fixed;top:4px;right:8px;font-size:13px;color:#ffd36b}
</style></head><body>
<div id="conn"></div>

<div id="s_idle" class="screen">
  <h1>Pilih Template</h1>
  <div class="wrap" style="max-width:320px"><img id="cam1" class="cam"></div>
  <div id="grid"></div>
</div>

<div id="s_shoot" class="screen">
  <h1 id="shotlabel"></h1>
  <div class="wrap"><img id="cam2" class="cam"><div id="count"></div><div id="flash"></div></div>
  <div class="center"><button class="btn alt" onclick="post('/api/cancel')">Batal</button></div>
</div>

<div id="s_proc" class="screen center"><h1 style="margin-top:30vh">Memproses foto...</h1></div>

<div id="s_result" class="screen center">
  <img id="result"><br>
  <div id="qrbox"></div>
  <div id="actions">
    <button class="btn alt" onclick="post('/api/reset')">Ulang</button>
    <button class="btn" id="upbtn" onclick="post('/api/upload')">Upload &amp; QR</button>
  </div>
</div>
<div id="msg"></div>

<script>
const $=id=>document.getElementById(id);
const post=u=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
let cur="",stamp=0,upl="";
function show(id){
  if(cur===id)return;cur=id;
  document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on",e.id===id));
  $("cam1").src=id==="s_idle"?"/stream?"+Date.now():"";
  $("cam2").src=id==="s_shoot"?"/stream?"+Date.now():"";
}
async function loadTemplates(){
  const list=await (await fetch("/api/templates")).json();
  $("grid").innerHTML=list.map(t=>`<div class="card" onclick="start('${t.id}')"><img src="/thumb/${t.id}"><div>${t.name} · ${t.count} foto</div></div>`).join("");
}
async function start(id){
  const r=await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({template:id})});
  if(!r.ok)$("msg").textContent=(await r.json()).error;
}
function render(s){
  $("msg").textContent=s.error||"";
  if(s.phase==="idle")show("s_idle");
  else if(s.phase==="countdown"||s.phase==="flash"){
    show("s_shoot");
    $("shotlabel").textContent=`Foto ${s.shot}/${s.total}`;
    $("count").textContent=s.phase==="countdown"?s.count:"";
    $("flash").style.opacity=s.phase==="flash"?0.9:0;
  }else if(s.phase==="processing")show("s_proc");
  else if(s.phase==="result"){
    show("s_result");
    if(s.stamp!==stamp){stamp=s.stamp;$("result").src="/result.jpg?"+stamp;}
    if(s.upload!==upl){
      upl=s.upload;
      $("qrbox").innerHTML=s.upload==="done"?`<p>Scan untuk download:</p><img id="qr" src="/api/qr?${Date.now()}"><p style="font-size:13px;word-break:break-all">${s.link}</p>`
        :s.upload==="uploading"?"<p>Mengupload...</p>":"";
      $("upbtn").style.display=s.upload==="done"?"none":"";
    }
  }
}
async function poll(){
  try{render(await (await fetch("/api/status")).json());$("conn").textContent="";}
  catch(e){$("conn").textContent="Menyambung ulang...";}
  setTimeout(poll,350);
}
loadTemplates();poll();
</script></body></html>
